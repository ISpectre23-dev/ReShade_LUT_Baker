name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure x64 Release build
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Generate synthetic validation fixtures
        run: build/Release/rise_tex_fixtures.exe build/fixtures

      - name: Upload add-on
        uses: actions/upload-artifact@v4
        with:
          name: ReShadeLUTBaker-x64
          path: |
            build/Release/ReShadeLUTBaker.addon64
            README.md
            LICENSE
            THIRD_PARTY_NOTICES.md
            build/Release/licenses/
          if-no-files-found: error

      - name: Upload synthetic CUBE PNG Rise and Wilds validation fixtures
        uses: actions/upload-artifact@v4
        with:
          name: ReShadeLUTBaker-validation-fixtures
          path: build/fixtures/
          if-no-files-found: error

      - name: Upload Wilds validation tools
        uses: actions/upload-artifact@v4
        with:
          name: ReShadeLUTBaker-Wilds-validation-tools
          path: |
            build/Release/wilds_tex_validate.exe
            tools/validate_wilds_tex.py
            tools/validate_cube.py
            THIRD_PARTY_NOTICES.md
            build/Release/licenses/
          if-no-files-found: error

name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure x64 Release build
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload add-on
        uses: actions/upload-artifact@v4
        with:
          name: ReShadeLUTBaker-x64
          path: build/Release/ReShadeLUTBaker.addon64
          if-no-files-found: error
